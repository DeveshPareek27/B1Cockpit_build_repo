name: Create Electron Build

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # create tags and releases

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout Build Repository (this repository)
      # ---------------------------------------------------------------
      - name: Checkout Build Repository
        uses: actions/checkout@v4
        with:
          path: BuildRepository

      # ---------------------------------------------------------------
      # 2. Checkout ENT_B1_Cockpit
      # ---------------------------------------------------------------
      - name: Checkout ENT_B1_Cockpit
        uses: actions/checkout@v4
        with:
          repository: entitecdev3/ENT_B1_Cockpit
          ref: main
          path: ENT_B1_Cockpit
          token: ${{ secrets.PAT_TOKEN }}

      # ---------------------------------------------------------------
      # 3. Checkout ENT_B1_Scripts
      # ---------------------------------------------------------------
      - name: Checkout ENT_B1_Scripts
        uses: actions/checkout@v4
        with:
          repository: entitecdev3/ENT_B1_Scripts
          ref: main
          path: ENT_B1_Scripts
          token: ${{ secrets.PAT_TOKEN }}

      # ---------------------------------------------------------------
      # 4. Checkout ENT_RED_CustomNodes
      # ---------------------------------------------------------------
      - name: Checkout ENT_RED_CustomNodes
        uses: actions/checkout@v4
        with:
          repository: entitecdev3/ENT_RED_CustomNodes
          ref: main
          path: ENT_RED_CustomNodes
          token: ${{ secrets.PAT_TOKEN }}

      # ---------------------------------------------------------------
      # 5. Setup Node.js
      # ---------------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          # node-version: "20"

      # ---------------------------------------------------------------
      # 6. Debug Workspace
      # ---------------------------------------------------------------
      - name: Debug Workspace
        shell: pwsh
        run: |
          Write-Host "Workspace:"
          Get-ChildItem $env:GITHUB_WORKSPACE

          Write-Host ""
          Write-Host "ENT_B1_Cockpit"
          Get-ChildItem "$env:GITHUB_WORKSPACE\ENT_B1_Cockpit"

          Write-Host ""
          Write-Host "ENT_B1_Scripts"
          Get-ChildItem "$env:GITHUB_WORKSPACE\ENT_B1_Scripts"

          Write-Host ""
          Write-Host "ENT_RED_CustomNodes"
          Get-ChildItem "$env:GITHUB_WORKSPACE\ENT_RED_CustomNodes"

      # ---------------------------------------------------------------
      # 7. Create Config File
      # ---------------------------------------------------------------
      - name: Override Config Paths for CI
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $buildRepo = "$ws\BuildRepository"

          $content = @"
          PROJECT=ENT_B1_Cockpit
          UI5_PATH=$ws\ENT_B1_Cockpit
          API_PATH=$ws
          SCRIPT_PATH=$ws\ENT_B1_Scripts
          CUSTOM_NODE_PATH=$ws\ENT_RED_CustomNodes
          UI_BUILD_PATH=$buildRepo\Utils
          Build_Dir=B1Cockpit_Build
          COPY_DEST_PATH=
          "@

          [System.IO.File]::WriteAllText(
              "$buildRepo\Electron_build_Scripts\0_0_Config.env",
              $content.Trim(),
              [System.Text.Encoding]::ASCII
          )

          Write-Host "Generated Config:"
          Get-Content "$buildRepo\Electron_build_Scripts\0_0_Config.env"

      # ---------------------------------------------------------------
      # 8. Validate Required Files
      # ---------------------------------------------------------------
      - name: Validate Required Files
        shell: pwsh
        run: |
          $required = @(
            "$env:GITHUB_WORKSPACE\ENT_B1_Cockpit\flow.json",
            "$env:GITHUB_WORKSPACE\ENT_B1_Cockpit\version.json",
            "$env:GITHUB_WORKSPACE\ENT_B1_Cockpit\webapp"
          )

          $missing = $false

          foreach ($file in $required) {
            if (Test-Path $file) {
              Write-Host "[OK] $file"
            } else {
              Write-Host "[MISSING] $file"
              $missing = $true
            }
          }

          if ($missing) {
            exit 1
          }

      # ---------------------------------------------------------------
      # 9. Run Build
      # ---------------------------------------------------------------
      - name: Run createBuild.bat
        shell: cmd
        run: |
          call BuildRepository\Electron_build_Scripts\createBuild.bat

      # ---------------------------------------------------------------
      # 10. Prepare Release (unique tag per build + release notes)
      #     Tag format: v<app version>-build.<workflow run number>
      #     e.g. v1.2.3-build.57 -> every build gets its own release,
      #     even when version.json was not bumped.
      # ---------------------------------------------------------------
      - name: Prepare Release
        id: release_info
        shell: pwsh
        run: |
          $version = (Get-Content -Raw "$env:GITHUB_WORKSPACE\ENT_B1_Cockpit\version.json" | ConvertFrom-Json).version
          if (-not $version) { Write-Error "Version not found in ENT_B1_Cockpit\version.json"; exit 1 }

          $build   = "${{ github.run_number }}"
          $tag     = "v$version-build.$build"
          $exe     = "ENT_B1_Cockpit-Installer-$version.exe"
          $commit  = "${{ github.sha }}"
          $shortSha = $commit.Substring(0, 7)
          $date    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm') + ' UTC'

          $notes = @"
          ## ENT_B1_Cockpit $version (build $build)

          | | |
          |---|---|
          | **Version** | $version |
          | **Build** | #$build |
          | **Built** | $date |
          | **Commit** | [$shortSha](${{ github.server_url }}/${{ github.repository }}/commit/$commit) |
          | **Workflow run** | [#$build](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | **Installer** | ``$exe`` |
          "@
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP\release-notes.md", $notes)

          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`ntag=$tag`nexe=$exe`n")
          Write-Host "Release tag: $tag"

      # ---------------------------------------------------------------
      # 11. Upload Installer
      # ---------------------------------------------------------------
      - name: Upload Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ElectronInstaller-${{ steps.release_info.outputs.tag }}
          path: BuildRepository\Electron_build_Scripts\${{ steps.release_info.outputs.exe }}
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 12. Create GitHub Release (a new release for every build)
      # ---------------------------------------------------------------
      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ENT_B1_Cockpit ${{ steps.release_info.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/release-notes.md
          make_latest: true
          fail_on_unmatched_files: true
          files: BuildRepository/Electron_build_Scripts/${{ steps.release_info.outputs.exe }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
